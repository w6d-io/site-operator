# The operator works inside the gateway namespace. It reads no Secrets, writes only
# its own zones ConfigMap (by name), and cannot change a Site's spec (status only).
# The only cluster-wide grants are reading Zones (cluster-scoped, admin-written)
# and reading Ingresses (host collision check).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: site-operator
  namespace: auth
rules:
- apiGroups: [auth.w6d.io]
  resources: [sites]
  verbs: [get, list, watch]
- apiGroups: [auth.w6d.io]
  resources: [sites/status]
  verbs: [get, update, patch]
- apiGroups: [auth.w6d.io]
  resources: [gateways]
  verbs: [get, list, watch]
- apiGroups: [auth.w6d.io]
  resources: [gateways/status]
  verbs: [get, update, patch]
- apiGroups: [oathkeeper.ory.sh]
  resources: [rules]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [cert-manager.io]
  resources: [certificates]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [site-operator-zones]
  verbs: [get, update, patch]
# Gateway: read the chart's base Oathkeeper config; create and delete the
# versioned config ConfigMaps (RBAC cannot scope create/delete by name: the
# site-operator-gateway-config policy limits both to <prefix>-<hash8>, created
# immutable); roll the Oathkeeper Deployment (site-operator-gateway-rollout lets
# it change only the config-hash annotation and the config volume's ConfigMap).
# Names follow the --gateway-* flags.
- apiGroups: [""]
  resources: [configmaps]
  verbs: [create, delete]
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [auth-oathkeeper-config-base]
  verbs: [get]
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [auth-oathkeeper]
  verbs: [get, patch]
- apiGroups: ["", events.k8s.io]
  resources: [events]
  verbs: [create, patch]
# RulesLoaded: find the Oathkeeper pods, then read GET :4456/rules on each (no watch, no cache)
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: site-operator
  namespace: auth
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: site-operator}
subjects:
- {kind: ServiceAccount, name: site-operator, namespace: auth}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: site-operator-zones
rules:
- apiGroups: [auth.w6d.io]
  resources: [zones]
  verbs: [get, list, watch]
- apiGroups: [auth.w6d.io]
  resources: [zones/status]
  verbs: [get, update, patch]
# HostTaken: a Site's own Ingress is never created for a host another Ingress
# in the cluster serves (read-only; Ingress writes stay in the gateway namespace)
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: [get, list, watch]
- apiGroups: ["", events.k8s.io]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: site-operator-zones
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: site-operator-zones}
subjects:
- {kind: ServiceAccount, name: site-operator, namespace: auth}
