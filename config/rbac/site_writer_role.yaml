# jinbe writes Site intent and the Gateway (global handler settings) only. It
# cannot create Ingresses, Rules, Certificates or Services, cannot touch the
# Oathkeeper config or Deployment, and cannot write status (the operator owns it).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: site-writer
  namespace: auth
rules:
- apiGroups: [auth.w6d.io]
  resources: [sites]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [auth.w6d.io]
  resources: [sites/status]
  verbs: [get]
- apiGroups: [auth.w6d.io]
  resources: [gateways]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [auth.w6d.io]
  resources: [gateways/status]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: site-writer-jinbe
  namespace: auth
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: site-writer}
subjects:
- {kind: ServiceAccount, name: auth-jinbe, namespace: auth}
